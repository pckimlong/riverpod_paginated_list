name: riverpod_paginated_list
description: A lightweight pagination utility for Flutter with Riverpod. Supports skeleton loading, external items injection, and both zero-based and one-based pagination.
version: 0.1.1
homepage: https://github.com/pckimong/riverpod_paginated_list
repository: https://github.com/pckimong/riverpod_paginated_list
issue_tracker: https://github.com/pckimong/riverpod_paginated_list/issues

environment:
  sdk: ^3.10.1
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  hooks_riverpod: ">=2.6.1 <4.0.0"
  fast_immutable_collections: ">=10.2.4 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
